name: Daily Chess Puzzle Post

on:
  schedule:
    # 09:00 UTC every day
    - cron: "0 9 * * *"
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Cache the puzzle CSV so we don't re-download it every run
      - name: Cache Lichess puzzle CSV
        uses: actions/cache@v4
        id: puzzle-cache
        with:
          path: puzzles/
          key: lichess-puzzles-v1

      - name: Download puzzle CSV (if not cached)
        if: steps.puzzle-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p puzzles
          curl -L "https://database.lichess.org/puzzle-themes/all.csv" \
               -o puzzles/lichess_db_puzzle.csv
        # ↑ This is the ~250 MB filtered CSV. For the full database swap to:
        # https://database.lichess.org/lichess_db_puzzle.csv.zst (needs zstd)

      # Restore used_puzzles.db across runs via cache
      # (For production, store this in a persistent store or commit it)
      - name: Restore used-puzzles database
        uses: actions/cache@v4
        with:
          path: used_puzzles.db
          key: used-puzzles-${{ github.run_number }}
          restore-keys: used-puzzles-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Post puzzle
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          PUZZLE_RATING_MIN:      ${{ vars.PUZZLE_RATING_MIN }}
          PUZZLE_RATING_MAX:      ${{ vars.PUZZLE_RATING_MAX }}
          PUZZLE_THEMES:          ${{ vars.PUZZLE_THEMES }}
        run: python main.py
